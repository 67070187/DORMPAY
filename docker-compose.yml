services:
  mysql:
    image: mysql:8.4
    container_name: dormpay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dormpay
    ports:
      - "3307:3306"
    volumes:
      - dormpay-data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: dormpay-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  dormpay-data:
