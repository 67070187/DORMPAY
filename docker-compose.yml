# รันทั้งระบบ:            docker compose up -d --build
# รันแค่ฐานข้อมูล (ตอน dev): docker compose up -d mysql adminer

services:
  mysql:
    image: mysql:8.4
    container_name: dormpay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dormpay
    ports:
      - "3307:3306"
    volumes:
      - dormpay-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer
    container_name: dormpay-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  backend:
    build: ./backend
    container_name: dormpay-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: dormpay
      JWT_SECRET: ${JWT_SECRET:-dormpay-docker-secret-change-me}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: dormpay-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      JWT_SECRET: ${JWT_SECRET:-dormpay-docker-secret-change-me}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  dormpay-data:
